# 番剧轮播 · 预构建镜像部署
#
#   1) cp .env.example .env && vi .env     # 填 WebDAV 地址与账号
#   2) docker compose up -d
#   3) 打开 http://<宿主机>:8088/
#
# 首次启动会自动扫描媒体库（大库可能几十分钟），进度见 docker compose logs -f

name: anime-rotator

services:
  anime-rotator:
    image: ${IMAGE:-ghcr.io/OWNER/anime-rotator:latest}
    container_name: anime-rotator
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:8088"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      TIMEZONE: "${TIMEZONE:-Asia/Shanghai}"
      PORT: "8088"

      # WebDAV 源
      WEBDAV_BASE_URL: "${WEBDAV_BASE_URL}"
      WEBDAV_ROOT: "${WEBDAV_ROOT:-动画}"
      WEBDAV_USERNAME: "${WEBDAV_USERNAME}"
      WEBDAV_PASSWORD: "${WEBDAV_PASSWORD}"
      WEBDAV_TIMEOUT_MS: "${WEBDAV_TIMEOUT_MS:-30000}"

      # 取流方式：proxy（后端带凭据转发，浏览器开箱可播）
      #          redirect（302 直链，需 urlPrefix 免鉴权或前置注入鉴权的反代）
      STREAM_MODE: "${STREAM_MODE:-proxy}"
      STREAM_URL_PREFIX: "${STREAM_URL_PREFIX:-}"
      STREAM_TOKEN: "${STREAM_TOKEN:-}"
      STREAM_EMBED_CREDENTIALS: "${STREAM_EMBED_CREDENTIALS:-false}"

      # auto=没有索引才扫描 / always=每次启动都扫 / never=只启动服务
      SCAN_ON_START: "${SCAN_ON_START:-auto}"
    volumes:
      # 索引与时长缓存（务必持久化，避免重启后重新扫描）
      - ./data:/app/data
      # 想自定义频道编排时：cp config.compose.json config.json，再打开下面这行
      # - ./config.json:/app/config.json:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8088/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 可选：定时重扫索引（每天 04:00），新增番剧后自动进时间轴
  rescan:
    image: ${IMAGE:-ghcr.io/OWNER/anime-rotator:latest}
    profiles: ["recurring"]
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          sleep 86400
          echo "[rescan] $(date -Iseconds) 重新扫描媒体库"
          if node src/cli/scan.mjs; then
            echo "[rescan] 通知主服务热加载索引"
            wget -q -O- --post-data='' http://anime-rotator:8088/api/reload || echo "[rescan] 热加载失败，请重启主服务"
          else
            echo "[rescan] 扫描失败，等下一轮"
          fi
        done
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      WEBDAV_BASE_URL: "${WEBDAV_BASE_URL}"
      WEBDAV_ROOT: "${WEBDAV_ROOT:-动画}"
      WEBDAV_USERNAME: "${WEBDAV_USERNAME}"
      WEBDAV_PASSWORD: "${WEBDAV_PASSWORD}"
      WEBDAV_TIMEOUT_MS: "${WEBDAV_TIMEOUT_MS:-30000}"
    volumes:
      - ./data:/app/data
