# 番剧轮播 · 一条命令起飞
#
#   docker compose up -d
#   打开 http://<宿主机>:8088/admin  →  填 WebDAV → 扫描 → 选片 → 编排
#
# 不需要预先准备任何配置文件：配置保存在 ./data/settings.json（随数据卷持久化）。

name: anime-rotator

services:
  anime-rotator:
    image: ${IMAGE:-ghcr.io/luvhx/anime-rotator:latest}
    container_name: anime-rotator
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8088}:8088"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # 以下都可在 /admin 界面里配置，通常不需要填。
      # 想用环境变量注入（例如 GitOps / 自动化部署）时取消注释：
      # WEBDAV_BASE_URL: "http://192.168.1.10:19798/dav/115/Media"
      # WEBDAV_ROOT: "动画"
      # WEBDAV_USERNAME: "user@example.com"
      # WEBDAV_PASSWORD: "password"
      # STREAM_MODE: "proxy"            # proxy | redirect
      # STREAM_URL_PREFIX: "https://media.example.com/anime"
      # SCAN_ON_START: "auto"           # auto | always | never
      # ADMIN_PASSWORD: "changeme"      # 给 /admin 与 /api/admin 加 HTTP Basic 认证
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8088/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
