name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 包名与仓库名解耦：旧的 ghcr.io/<owner>/anime-rotator 包与已删除的仓库绑定过，
  # 新仓库无法写入，故使用独立包名。
  IMAGE_NAME: anime-rotator-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 语法检查
        run: |
          set -e
          for f in src/*.mjs src/cli/*.mjs tools/*.mjs public/app.js public/admin.js; do
            node --check "$f"
          done
          echo "语法检查通过"

      - name: 编排引擎自检
        run: node tools/selftest.mjs

      - name: 字幕转换自检
        run: node tools/selftest-subtitles.mjs

      - name: 冷启动冒烟（未配置状态）
        run: node tools/smoke-boot.mjs

  docker:
    name: 构建并推送镜像 (${{ matrix.name }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 轻量
            suffix: ""
            with_ffmpeg: "false"
          - name: 含 ffmpeg
            suffix: "-ffmpeg"
            with_ffmpeg: "true"
    steps:
      - uses: actions/checkout@v4

      - name: 计算镜像名（小写）
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            suffix=${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            WITH_FFMPEG=${{ matrix.with_ffmpeg }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
